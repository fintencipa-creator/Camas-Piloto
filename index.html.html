<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camas Piloto</title>
    <!-- Bootstrap CSS --><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS (xlsx) for reading and parsing Excel files --><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js for generating charts --><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Date adapter for Chart.js --><script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- Chart.js Annotation Plugin --><script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .loader {
            border: 5px solid #e9ecef;
            border-top: 5px solid #0d6efd;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .file-upload-label {
            transition: background-color 0.2s ease-in-out;
        }
        .file-upload-label:hover {
            background-color: #e9ecef !important;
        }
        .table-bordered,
        .table-bordered th,
        .table-bordered td {
            border: 1px solid black;
        }
        .table-bordered {
            border-width: 2px;
        }
        .block-card {
            margin-bottom: 1.5rem;
        }
        .nav-tabs .nav-link {
            cursor: pointer;
        }
        .footer-signature {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 3rem;
            text-align: right;
            padding-right: 15px;
            padding-bottom: 10px;
        }
        /* Ajuste de altura dinámica para gráficas en móvil */
        .chart-container {
            position: relative;
            height: 400px; /* Altura para móvil */
            width: 100%;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 450px; /* Altura para tablets y escritorio */
            }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid my-4 my-md-5">
        <header class="text-center mb-5">
            <h1 class="fw-bold text-body mb-2">Camas Piloto</h1>
            <p class="fs-5 text-muted">Sube un archivo .xlsx o .xls para ver los datos y gráficos de cada hoja.</p>
        </header>

        <main>
            <div class="card shadow-lg p-3 mb-4">
                <label for="file-upload" class="file-upload-label d-flex flex-column align-items-center justify-content-center w-100 border border-2 border-dashed rounded bg-light" style="min-height: 8rem; cursor: pointer;">
                    <div class="text-center p-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-cloud-arrow-up text-muted mb-3" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2z"/>
                            <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383zm.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.12-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
                        </svg>
                        <p class="mb-2 text-muted"><span class="fw-semibold">Haz clic para subir</span> o arrastra y suelta</p>
                        <p class="text-secondary" style="font-size: 0.8rem;">Archivos soportados: .xlsx, .xls</p>
                    </div>
                    <input id="file-upload" type="file" class="d-none" accept=".xlsx, .xls" />
                </label>
            </div>

            <div id="file-info" class="d-none text-center mb-4">
                <p class="mb-2"><strong>Archivo cargado:</strong> <span id="file-name" class="text-primary"></span></p>
                <button id="clear-file-btn" class="btn btn-sm btn-outline-danger">Quitar archivo</button>
            </div>

            <div id="loading" class="d-none loader mx-auto"></div>
            
            <ul class="nav nav-tabs mb-3" id="main-tabs">
                <li class="nav-item">
                    <a class="nav-link active" id="valves-tab" data-bs-toggle="tab" data-bs-target="#valves-view">Vista por Válvula</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="report-tab" data-bs-toggle="tab" data-bs-target="#report-view">Reporte Semanal</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="graphs-tab" data-bs-toggle="tab" data-bs-target="#graphs-view">Gráficas</a>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="valves-view">
                    <div id="blocks-container" class="mb-4"></div>
                    <div id="sheet-content-container"></div>
                </div>
                <div class="tab-pane fade" id="report-view"></div>
                <div class="tab-pane fade" id="graphs-view"></div>
            </div>
        </main>
        
        <footer class="footer-signature">
            Herramienta desarrollada por Victor Fabian Intencipa
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const fileUpload = document.getElementById('file-upload');
        const blocksContainer = document.getElementById('blocks-container');
        const sheetContentContainer = document.getElementById('sheet-content-container');
        const reportContainer = document.getElementById('report-view');
        const graphsContainer = document.getElementById('graphs-view');
        const loadingIndicator = document.getElementById('loading');
        
        const fileInfoContainer = document.getElementById('file-info');
        const fileNameDisplay = document.getElementById('file-name');
        const clearFileBtn = document.getElementById('clear-file-btn');

        let activeCharts = [];
        let workbookData = null;

        // Register Chart.js annotation plugin
        if (window.ChartAnnotation) {
            Chart.register(window.ChartAnnotation);
        }

        fileUpload.addEventListener('change', handleFile);
        clearFileBtn.addEventListener('click', clearFile);

        document.getElementById('report-tab').addEventListener('click', () => {
            if (workbookData) generateWeeklyReport();
            else reportContainer.innerHTML = `<div class="alert alert-info">Por favor, carga un archivo de Excel para generar el reporte.</div>`;
        });

        document.getElementById('graphs-tab').addEventListener('click', () => {
            if (workbookData) generateGraphsReport();
            else graphsContainer.innerHTML = `<div class="alert alert-info">Por favor, carga un archivo de Excel para generar los gráficos.</div>`;
        });

        reportContainer.addEventListener('click', function(event) {
            if (event.target && event.target.id === 'send-report-btn') sendReportByEmail();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const storedData = localStorage.getItem('excelData');
            const storedFilename = localStorage.getItem('excelFilename');
            if (storedData && storedFilename) {
                loadingIndicator.classList.remove('d-none');
                try {
                    const binaryString = atob(storedData);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    processAndDisplayWorkbook(bytes.buffer, storedFilename);
                } catch(e) { console.error(e); }
                loadingIndicator.classList.add('d-none');
            }
        });

        function clearFile() {
            fileUpload.value = '';
            blocksContainer.innerHTML = '';
            sheetContentContainer.innerHTML = '';
            reportContainer.innerHTML = '';
            graphsContainer.innerHTML = '';
            fileInfoContainer.classList.add('d-none');
            activeCharts.forEach(chart => chart.destroy());
            activeCharts = [];
            workbookData = null;
            localStorage.removeItem('excelData');
            localStorage.removeItem('excelFilename');
            bootstrap.Tab.getInstance(document.getElementById('valves-tab')).show();
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            clearFile(); 
            loadingIndicator.classList.remove('d-none');
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const bytes = new Uint8Array(arrayBuffer);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                localStorage.setItem('excelData', btoa(binary));
                localStorage.setItem('excelFilename', file.name);
                processAndDisplayWorkbook(arrayBuffer, file.name);
                loadingIndicator.classList.add('d-none');
            };
            reader.readAsArrayBuffer(file);
        }
        
        const parseNumericValue = (value) => {
            if (value === null || value === undefined || value === '') return NaN;
            if (typeof value === 'number') return value;
            let cleanString = String(value).replace(/%/g, '').trim();
            if (cleanString.includes(',')) cleanString = cleanString.replace(/\./g, '').replace(',', '.');
            return (isFinite(cleanString) && cleanString !== '') ? parseFloat(cleanString) : NaN;
        };

        function getBlockForValve(valveNumber) {
            if (valveNumber >= 36 && valveNumber <= 48) return 'Bloque 1';
            if (valveNumber >= 24 && valveNumber <= 32) return 'Bloque 2';
            if (valveNumber >= 15 && valveNumber <= 23) return 'Bloque 3';
            if (valveNumber >= 1 && valveNumber <= 13) return 'Bloque 4';
            if (valveNumber >= 58 && valveNumber <= 65) return 'Bloque 5';
            if (valveNumber >= 49 && valveNumber <= 57) return 'Bloque 6';
            return 'Otros';
        }

        function processAndDisplayWorkbook(arrayBuffer, filename) {
            fileNameDisplay.textContent = filename;
            fileInfoContainer.classList.remove('d-none');
            try {
                const data = new Uint8Array(arrayBuffer);
                workbookData = XLSX.read(data, { type: 'array' });
                const sheetNames = workbookData.SheetNames.slice(2);
                const valvesByBlock = {};

                sheetNames.forEach((sheetName) => {
                    const match = sheetName.match(/\((\d+)\)/);
                    if (match && match[1]) {
                        const valveNumber = parseInt(match[1], 10);
                        const blockName = getBlockForValve(valveNumber);
                        if (!valvesByBlock[blockName]) valvesByBlock[blockName] = [];
                        valvesByBlock[blockName].push({ sheetName, valveNumber });
                    }
                });

                const sortedBlocks = Object.keys(valvesByBlock).sort((a, b) => {
                    const regex = /Bloque (\d+)([A-Z])?/;
                    const matchA = a.match(regex); const matchB = b.match(regex);
                    if (a === 'Otros') return 1; if (b === 'Otros') return -1;
                    if (matchA && matchB) {
                        const numA = parseInt(matchA[1], 10); const numB = parseInt(matchB[1], 10);
                        if (numA !== numB) return numA - numB;
                        return (matchA[2] || '').localeCompare(matchB[2] || '');
                    }
                    return a.localeCompare(b);
                });

                sortedBlocks.forEach(blockName => {
                    const blockCard = document.createElement('div');
                    blockCard.className = 'card block-card shadow-sm';
                    blockCard.innerHTML = `<div class="card-header fw-bold bg-primary text-white">${blockName}</div>`;
                    const cardBody = document.createElement('div');
                    cardBody.className = 'card-body d-flex flex-wrap gap-2';
                    valvesByBlock[blockName].sort((a, b) => a.valveNumber - b.valveNumber).forEach(({ sheetName, valveNumber }) => {
                        const btn = document.createElement('button');
                        btn.textContent = `Válvula ${valveNumber}`;
                        btn.className = 'btn btn-outline-secondary';
                        btn.onclick = () => {
                            document.querySelectorAll('#blocks-container .btn').forEach(b => b.classList.replace('btn-primary', 'btn-outline-secondary'));
                            btn.classList.replace('btn-outline-secondary', 'btn-primary');
                            displaySheetContent(sheetName);
                        };
                        cardBody.appendChild(btn);
                    });
                    blockCard.appendChild(cardBody);
                    blocksContainer.appendChild(blockCard);
                });
                if (blocksContainer.querySelector('.btn')) blocksContainer.querySelector('.btn').click();
            } catch (error) { clearFile(); }
        }

        function displaySheetContent(sheetName) {
            sheetContentContainer.innerHTML = '';
            activeCharts.forEach(c => c.destroy()); activeCharts = [];
            const sheetContainer = document.createElement('div');
            sheetContainer.className = 'card shadow';
            const worksheet = workbookData.Sheets[sheetName];
            const json_data = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
            if (json_data.length > 0) {
                createTable(sheetContainer, json_data);
                createCharts(sheetContainer, json_data);
            } else {
                sheetContainer.innerHTML = `<p class="text-center text-muted m-3">Esta hoja está vacía.</p>`;
            }
            sheetContentContainer.appendChild(sheetContainer);
        }

        function createTable(container, data) {
            const tableWrapper = document.createElement('div');
            tableWrapper.className = 'table-responsive';
            const table = document.createElement('table');
            table.className = 'table table-bordered table-striped table-hover table-sm mb-0';
            table.style.fontSize = '0.8rem';
            const thead = document.createElement('thead');
            thead.className = 'table-light';
            const hr = document.createElement('tr');
            if (data[0]) data[0].forEach(t => { const th = document.createElement('th'); th.textContent = t; hr.appendChild(th); });
            thead.appendChild(hr);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            data.slice(1).forEach((rowData, rowIndex) => {
                const originalRowIndex = rowIndex + 1;
                if (!rowData || rowData.length === 0) return;
                const tr = document.createElement('tr');
                rowData.forEach((cellData, cellIndex) => {
                    const td = document.createElement('td');
                    td.textContent = cellData;
                    if (cellIndex > 0) {
                        let cur = NaN, tar = NaN, apply = false;
                        if (originalRowIndex === 6) { cur = parseNumericValue(cellData); tar = parseNumericValue(data[5][cellIndex]); apply = true; }
                        else if (originalRowIndex === 8) { cur = parseNumericValue(cellData); tar = parseNumericValue(data[7][cellIndex]); apply = true; }
                        else if (originalRowIndex === 14) { cur = parseNumericValue(cellData); if (isNaN(cur)) cur = 0; tar = 100; apply = true; }
                        if (apply && !isNaN(cur) && !isNaN(tar) && tar !== 0 && cur !== 0) {
                            const diff = Math.abs(cur - tar) / tar;
                            if (diff <= 0.10) td.style.backgroundColor = 'rgba(144, 238, 144, 0.6)';
                            else if (diff <= 0.20) td.style.backgroundColor = 'rgba(255, 255, 0, 0.6)';
                            else td.style.backgroundColor = 'rgba(255, 99, 71, 0.6)';
                        }
                    }
                    if (originalRowIndex === 1) tr.style.color = 'blue';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            tableWrapper.appendChild(table);
            container.appendChild(tableWrapper);
        }

        function createCharts(container, data) {
            const chartsGrid = document.createElement('div');
            chartsGrid.className = 'row g-4 mt-3 p-4';
            container.appendChild(chartsGrid);
            const clean = (v, pct = false) => {
                const n = parseNumericValue(v);
                if (isNaN(n)) return null;
                return (pct && Math.abs(n) <= 1 && v !== '0' && v !== 0) ? n * 100 : n;
            };
            const configs = [
                { title: 'Conductividad Electrica', header: 4, rows: [5, 6], colors: ['#00599D', '#ED7D31'], yMin: 0, yMax: 3, yStep: 0.2 },
                { title: 'pH', header: 4, rows: [7, 8], colors: ['#00B050', '#FFC000'] },
                { title: '% Ejecución', header: 4, rows: [14], colors: ['#7030A0'], isPct: true },
                { title: 'N-NO3', header: 4, rows: [15], colors: ['#5A9BD5'] }
            ];
            configs.forEach(config => {
                const headerRow = data[config.header];
                const labels = []; const datasetsData = config.rows.map(() => []);
                for (let i = 1; i < headerRow.length; i++) {
                    if (!headerRow[i]) continue;
                    labels.push(String(headerRow[i]));
                    config.rows.forEach((r, idx) => datasetsData[idx].push(clean(data[r][i], config.isPct)));
                }
                const wrapper = document.createElement('div'); 
                wrapper.className = 'col-12 col-md-6';
                const chartBox = document.createElement('div');
                chartBox.className = 'chart-container'; // Aplicamos clase CSS con altura adaptable
                const canvas = document.createElement('canvas'); 
                chartBox.appendChild(canvas);
                wrapper.appendChild(chartBox);
                chartsGrid.appendChild(wrapper);
                
                const chart = new Chart(canvas, {
                    type: 'line',
                    data: { labels, datasets: config.rows.map((r, i) => ({ label: data[r][0], data: datasetsData[i], borderColor: config.colors[i], tension: 0.1, spanGaps: true })) },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { title: { display: true, text: config.title } }, 
                        scales: { 
                            y: { min: config.yMin, max: config.yMax, ticks: { callback: v => config.isPct ? v + '%' : v } },
                            x: { ticks: { maxRotation: 45, minRotation: 45 } }
                        } 
                    }
                });
                activeCharts.push(chart);
            });
        }

        function generateWeeklyReport() {
            reportContainer.innerHTML = '';
            const sheetNames = workbookData.SheetNames.slice(2);
            let tSum = 0, tCount = 0; const bData = {};
            const alerts = { ce: [], ph: [], ej: [] };

            sheetNames.forEach(sn => {
                const js = XLSX.utils.sheet_to_json(workbookData.Sheets[sn], { header: 1, raw: false });
                const vNum = parseInt(sn.match(/\((\d+)\)/)?.[1] || 0);
                if (!vNum) return;
                const bn = getBlockForValve(vNum);
                if (!bData[bn]) bData[bn] = { s: 0, c: 0 };
                const ejRow = js[14];
                if (ejRow) {
                    ejRow.slice(1).slice(-6).forEach(v => {
                        const n = parseNumericValue(v);
                        if (!isNaN(n) && n > 0) { tSum += n; tCount++; bData[bn].s += n; bData[bn].c++; }
                    });
                }
                const check = (r, t) => getValuesForFirstAlertSequence(js[r], js[t] || null, t ? null : 100);
                const ceV = check(6, 5); if (ceV) alerts.ce.push({ vNum, vals: ceV });
                const phV = check(8, 7); if (phV) alerts.ph.push({ vNum, vals: phV });
                const ejV = check(14, 0); if (ejV) alerts.ej.push({ vNum, vals: ejV });
            });

            let html = `<div id="report-content-display"><div class="row">
                <div class="col-md-6 mb-4"><div class="card h-100"><div class="card-header bg-success text-white">Promedios (% Ejecución)</div><div class="card-body">
                <h5>General: ${(tSum / tCount || 0).toFixed(2)}%</h5><hr>
                <ul class="list-group">${Object.keys(bData).sort().map(b => `<li class="list-group-item d-flex justify-content-between">${b} <span>${(bData[b].s/bData[b].c || 0).toFixed(2)}%</span></li>`).join('')}</ul>
                </div></div></div>
                <div class="col-md-6 mb-4"><div class="card h-100"><div class="card-header bg-danger text-white">Alertas Críticas (3+ días)</div><div class="card-body">
                <h6>CE</h6>${renderAlerts(alerts.ce)}<hr><h6>pH</h6>${renderAlerts(alerts.ph)}<hr><h6>Ejecución</h6>${renderAlerts(alerts.ej)}
                </div></div></div></div></div>
                <div class="card mt-4"><div class="card-header bg-info text-white">Enviar Reporte</div><div class="card-body">
                <input type="text" id="email-recipients" class="form-control mb-2" placeholder="correo@ejemplo.com">
                <button id="send-report-btn" class="btn btn-primary">Preparar Correo</button></div></div>`;
            reportContainer.innerHTML = html;
        }

        function renderAlerts(arr) {
            if (!arr.length) return '<p class="small text-muted">Ninguna</p>';
            return `<div class="d-flex flex-wrap">${arr.sort((a,b)=>a.vNum-b.vNum).map(a => `<span class="badge bg-secondary m-1">V${a.vNum} (${a.vals.map(v=>v.toFixed(1)+'%').join(', ')})</span>`).join('')}</div>`;
        }

        function generateGraphsReport() {
            graphsContainer.innerHTML = '';
            const sheetNames = workbookData.SheetNames.slice(2);
            const data = {};
            let tCE={s:0,c:0}, tPH={s:0,c:0}, tEJ={s:0,c:0}, tNO={s:0,c:0};

            const calc = (row, tar, val=null) => {
                if(!row) return NaN;
                const last = row.slice(Math.max(1, row.length-6));
                let s=0, c=0;
                last.forEach((v,i) => {
                    const n = parseNumericValue(v); if(n===0 || isNaN(n)) return;
                    const t = val !== null ? val : parseNumericValue(tar[i + Math.max(1, row.length-6)]);
                    if(!isNaN(t) && t!==0) { s += (n/t)*100; c++; }
                });
                return c>0 ? s/c : NaN;
            };

            sheetNames.forEach(sn => {
                const js = XLSX.utils.sheet_to_json(workbookData.Sheets[sn], { header: 1, raw: false });
                const v = parseInt(sn.match(/\((\d+)\)/)?.[1] || 0); if(!v) return;
                const ce = calc(js[6], js[5]); const ph = calc(js[8], js[7]); const ej = calc(js[14], null, 100);
                let noS=0, noC=0; js[15]?.slice(-6).forEach(x => { const n=parseNumericValue(x); if(!isNaN(n) && n>0){noS+=n; noC++}});
                const no = noC>0 ? noS/noC : NaN;
                data[v] = {ce, ph, ej, no};
                if(!isNaN(ce)){tCE.s+=ce; tCE.c++} if(!isNaN(ph)){tPH.s+=ph; tPH.c++} if(!isNaN(ej)){tEJ.s+=ej; tEJ.c++} if(!isNaN(no)){tNO.s+=no; tNO.c++}
            });

            graphsContainer.innerHTML = `<div class="row text-center mb-4">
                ${[['% Ejecución', tEJ], ['Cumpl. CE', tCE], ['Cumpl. pH', tPH], ['N-NO3 Prom.', tNO]].map(x => `
                <div class="col-6 col-md-3 mb-2"><div class="card"><div class="card-header small py-1">${x[0]}</div><div class="card-body py-2"><h4>${(x[1].s/x[1].c || 0).toFixed(1)}${x[0].includes('%')||x[0].includes('Cumpl')?'%':''}</h4></div></div></div>`).join('')}
            </div><div class="row">
                ${['ejecucionBarChart', 'ceBarChart', 'phBarChart', 'nno3BarChart'].map(id => `<div class="col-12 mb-4"><div class="card shadow-sm"><div class="card-body"><div class="chart-container"><canvas id="${id}"></canvas></div></div></div></div>`).join('')}
            </div>`;

            const sorted = Object.keys(data).sort((a,b)=>a-b);
            const labels = sorted.map(v => 'V' + v);
            const createBar = (id, dKey, title, unit, min, max) => {
                const ctx = document.getElementById(id).getContext('2d');
                const vals = sorted.map(v => data[v][dKey]);
                new Chart(ctx, {
                    type: 'bar',
                    data: { labels, datasets: [{ data: vals, backgroundColor: vals.map(v => (v>=min && v<=max) ? 'rgba(75, 192, 192, 0.7)' : 'rgba(255, 99, 132, 0.7)') }] },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: { 
                            title: { display: true, text: title }, 
                            legend: { display: false }, 
                            annotation: { annotations: { l1: { type: 'line', yMin: min, yMax: min, borderColor: 'orange', borderDash: [6,6] }, l2: { type: 'line', yMin: max, yMax: max, borderColor: 'orange', borderDash: [6,6] } } } 
                        }, 
                        scales: { 
                            y: { beginAtZero: true, title: { display: true, text: unit } },
                            x: { ticks: { autoSkip: false, maxRotation: 90, minRotation: 90, font: { size: 10 } } }
                        } 
                    }
                });
            };

            createBar('ejecucionBarChart', 'ej', 'Cumplimiento % Ejecución', 'Porcentaje (%)', 90, 110);
            createBar('ceBarChart', 'ce', 'Cumplimiento CE', 'Porcentaje (%)', 90, 110);
            createBar('phBarChart', 'ph', 'Cumplimiento pH', 'Porcentaje (%)', 90, 110);
            createBar('nno3BarChart', 'no', 'Valor N-NO3', 'Valor', 150, 220);
        }

        function getValuesForFirstAlertSequence(row, tar, val=null) {
            if(!row) return null; let c=0; let v=[]; const start = Math.max(1, row.length-6);
            for(let i=start; i<row.length; i++) {
                const n = parseNumericValue(row[i]); const t = val !== null ? val : parseNumericValue(tar[i]);
                if(!isNaN(n) && !isNaN(t) && t!==0 && n!==0 && (Math.abs(n-t)/t > 0.20)) { c++; v.push((n/t)*100); }
                else { if(c>=3) return v; c=0; v=[]; }
            }
            return c>=3 ? v : null;
        }

        function sendReportByEmail() {
            const rec = document.getElementById('email-recipients').value; if(!rec) return;
            const body = document.getElementById('report-content-display').innerText;
            window.location.href = `mailto:${rec}?subject=Reporte Camas Piloto&body=${encodeURIComponent(body)}`;
        }
    </script>
</body>
</html>
